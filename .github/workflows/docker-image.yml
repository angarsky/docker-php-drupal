# Builds, smoke-tests and publishes the PHP 8.x images to Docker Hub.
#
# One folder per PHP minor version (8.4/, 8.5/, ...), each with:
#   Dockerfile                    -> angarsky/docker-php-drupal:X.Y.Z
#   Dockerfile + WITH_DATADOG=1   -> angarsky/docker-php-drupal:X.Y.Z-datadog
#   Alpine.Dockerfile             -> angarsky/docker-php-drupal:X.Y.Z-alpine-datadog
# X.Y.Z comes from the "FROM php:X.Y.Z-fpm..." lines (see .github/scripts/matrix.sh).
#
# Pull requests build and test every version, with no secrets. A push to main builds,
# tests and publishes only the version folders it changed; "Run workflow" on main
# publishes all of them. Publishing runs inside the "dockerhub" environment, which
# holds the DOCKERHUB_TOKEN secret and accepts deployments from main only.
name: Docker image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Only image changes publish. Workflow/test-only changes are verified in their PR.
    paths:
      - '8.*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick the PHP versions to build
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          # Validates every version folder, whatever gets built below.
          all=$(bash .github/scripts/matrix.sh)
          matrix=$all
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            changed=$(git diff --name-only "$BEFORE" "$SHA" | sed -nE 's#^(8\.[0-9]+)/.*#\1#p' | sort -u)
            dirs=''
            for d in $changed; do [ -d "$d" ] && dirs="$dirs $d"; done
            if [ -n "$dirs" ]; then
              # shellcheck disable=SC2086
              matrix=$(bash .github/scripts/matrix.sh $dirs)
            else
              matrix='{"include":[]}'
            fi
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            echo "Nothing to build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
            echo "$matrix" | jq -r '"Building: " + ([.include[] | .version + .suffix] | join(", "))' >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: build (${{ matrix.php }}, ${{ matrix.variant }})
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TAG: angarsky/docker-php-drupal:${{ matrix.version }}${{ matrix.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: WITH_DATADOG=${{ matrix.datadog }}
          tags: ${{ env.TAG }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}
          # Only main writes the cache (PR runs may not, and must not seed it); a cache
          # hiccup never fails the build.
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope={0}-{1},ignore-error=true', matrix.php, matrix.variant) || '' }}

      - name: Smoke test
        env:
          EXTENSIONS: ${{ matrix.extensions }}
        run: bash .github/scripts/smoke-test.sh "$TAG" "$EXTENSIONS"

      - name: Summary
        run: echo "Built and tested \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

  # The one check to require in the branch ruleset: it stays the same when versions
  # or variants are added or removed.
  ci:
    name: ci
    if: always()
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All builds passed
        env:
          PLAN: ${{ needs.plan.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "plan: $PLAN, build: $BUILD"
          if [ "$PLAN" != success ] || { [ "$BUILD" != success ] && [ "$BUILD" != skipped ]; }; then
            echo "::error::A build failed"
            exit 1
          fi

  publish:
    name: publish (${{ matrix.php }}, ${{ matrix.variant }})
    needs: [plan, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dockerhub
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TAG: angarsky/docker-php-drupal:${{ matrix.version }}${{ matrix.suffix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: angarsky
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Rebuilt from the cache the build job just wrote, then tested again here, so the
      # image pushed below is the exact one that passed the smoke test in this job.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: WITH_DATADOG=${{ matrix.datadog }}
          tags: ${{ env.TAG }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.php }}-${{ matrix.variant }}

      - name: Smoke test
        env:
          EXTENSIONS: ${{ matrix.extensions }}
        run: bash .github/scripts/smoke-test.sh "$TAG" "$EXTENSIONS"

      # Same inputs as "Build": every layer comes from this job's builder cache.
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          build-args: WITH_DATADOG=${{ matrix.datadog }}
          tags: ${{ env.TAG }}
          push: true
          provenance: mode=max
          sbom: true

      - name: Summary
        run: echo "Published \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
