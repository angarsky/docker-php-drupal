version: 2
updates:
  # New PHP patch releases -> one PR per version folder, bumping FROM in both of its
  # Dockerfiles (8.4/ stays on 8.4.x, 8.5/ on 8.5.x). A new minor version is a new
  # folder, added by hand - plus an entry here.
  - package-ecosystem: docker
    directory: /8.4
    schedule:
      interval: daily
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      php-8.4:
        patterns:
          - php
    commit-message:
      prefix: Docker image

  - package-ecosystem: docker
    directory: /8.5
    schedule:
      interval: daily
    ignore:
      - dependency-name: php
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    groups:
      php-8.5:
        patterns:
          - php
    commit-message:
      prefix: Docker image

  # Keeps the SHA-pinned actions in .github/workflows up to date.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - '*'
    commit-message:
      prefix: CI
